<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Diabetes Prediction AI</title>

    <link rel="stylesheet" href="style.css">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

</head>

<body>

    <div class="container">

        <div class="left-section">

            <h1>Diabetes Prediction AI</h1>

            <p>
                Smart healthcare prediction system powered by Machine Learning.
            </p>

            <img
                src="https://cdn-icons-png.flaticon.com/512/2785/2785819.png"
                alt="Healthcare">

        </div>

        <div class="right-section">

            <div class="card">

                <h2>Health Details</h2>

                <div class="form-grid">

                    <div class="input-group">
                        <label>Age</label>
                        <input type="number" id="Age" placeholder="Enter age">
                    </div>

                    <div class="input-group">
                        <label>Gender</label>
                        <select id="Gender">
                            <option value="Male">Male</option>
                            <option value="Female">Female</option>
                        </select>
                    </div>

                    <div class="input-group">
                        <label>BMI</label>
                        <input type="number" id="BMI" placeholder="Enter BMI">
                    </div>

                    <div class="input-group">
                        <label>Glucose Level</label>
                        <input type="number" id="Glucose" placeholder="Glucose">
                    </div>

                    <div class="input-group">
                        <label>Blood Pressure</label>
                        <input type="number" id="BloodPressure" placeholder="Blood Pressure">
                    </div>

                    <div class="input-group">
                        <label>HbA1c</label>
                        <input type="number" step="0.1" id="HbA1c" placeholder="HbA1c">
                    </div>

                    <div class="input-group">
                        <label>Cholesterol</label>
                        <input type="number" id="Cholesterol" placeholder="Cholesterol">
                    </div>

                    <div class="input-group">
                        <label>Family History</label>
                        <select id="FamilyHistory">
                            <option value="0">No</option>
                            <option value="1">Yes</option>
                        </select>
                    </div>

                    <div class="input-group">
                        <label>Physical Activity</label>
                        <select id="PhysicalActivity">
                            <option value="Low">Low</option>
                            <option value="Moderate">Moderate</option>
                            <option value="High">High</option>
                        </select>
                    </div>

                    <div class="input-group">
                        <label>Smoking</label>
                        <select id="Smoking">
                            <option value="0">No</option>
                            <option value="1">Yes</option>
                        </select>
                    </div>

                </div>

                <button onclick="predict()">
                    Predict Diabetes Risk
                </button>

                <div class="result-box" id="result">

                    Your result will appear here

                </div>

            </div>

        </div>

    </div>

    <script src="script.js"></script>

</body>

</html>
